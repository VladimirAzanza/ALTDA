# ALTDA — Java service (UI + REST) and Go service (engine).
#
#   docker compose -p altda up --build                        # Java uses its built-in mock of Go
#   ALTDA_GO_CLIENT=http docker compose -p altda up --build   # Java calls our Go service
#
# UI:         http://localhost:8000/
# Java:       http://localhost:8000/health
# Go direct:  http://localhost:8081/v1/health
services:
  go:
    build:
      context: ../go-service
    image: altda-go
    ports:
      - "${GO_PORT:-8081}:8081"
    env_file:
      - ../go-service/.env
    restart: unless-stopped

  java:
    build:
      context: ../java-service
    image: altda-java
    depends_on:
      - go
    ports:
      - "${JAVA_PORT:-8000}:8000"
    environment:
      # mock | http
      ALTDA_GO_CLIENT: ${ALTDA_GO_CLIENT:-mock}
      ALTDA_GO_BASE_URL: ${GO_BASE_URL:-http://go:8081}
      JAVA_OPTS: ${JAVA_OPTS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"ok\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
